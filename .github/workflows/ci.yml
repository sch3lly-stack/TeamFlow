name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: teamflow-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  DATABASE_URL: postgresql://teamflow:teamflow@localhost:5432/teamflow?schema=public
  TEST_DATABASE_URL: postgresql://teamflow:teamflow@localhost:5432/teamflow_test?schema=public
  JWT_ACCESS_SECRET: ci-only-secret-that-is-long-enough-for-tests
  RATE_LIMIT_DISABLED: "true"

jobs:
  quality:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamflow
          POSTGRES_PASSWORD: teamflow
          POSTGRES_DB: teamflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Create test database
        run: |
          PGPASSWORD=teamflow psql -h localhost -U teamflow -d teamflow -c "CREATE DATABASE teamflow_test;"

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Validate schema
        run: npx prisma validate --schema apps/api/prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: API integration tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamflow
          POSTGRES_PASSWORD: teamflow
          POSTGRES_DB: teamflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --include=dev
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Migrate and seed demo data
        run: |
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
          npm run db:seed
        env:
          NODE_ENV: development
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NODE_ENV: development
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t teamflow-api:ci .
      - name: Build web image
        run: docker build -f Dockerfile.web -t teamflow-web:ci .
